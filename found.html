<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt - Report Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between flex-wrap">
        <a class="navbar-brand" href="index.html">FindIt.</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="lost.html">Report Lost</a>
            <a class="active" href="found.html">Report Found</a>
            <a href="reports.html">My Reports</a>
        </div>
    </div>
</nav>

<div class="page-heading">
    <h1>Report a Found Item</h1>
    <p>Help someone recover their lost belongings.</p>
</div>

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="form-box">
                <h3 class="mb-4 text-success">Found Item Details</h3>

                <form action="#" method="get">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter item name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" required>
                            <option value="">Select Category</option>
                            <option>Electronics</option>
                            <option>Books</option>
                            <option>Clothing</option>
                            <option>Accessories</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3"
                                  placeholder="Describe the found item"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Found Location</label>
                        <input type="text" class="form-control"
                               placeholder="Where did you find it?">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date Found</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email" required>
                    </div>
                    <br>
                    <pr>Ubload File: </pr>
                    <input type="file" id="files" multiple><br><br><br>

                    <button type="submit" class="btn btn-success">
                        Submit Found Report
                    </button>

                    <a href="browse.html" class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</section>

<footer>
    <h4>FindIt.</h4>
    <p>Thank you for helping others!</p>
    <p>© 2026 FindIt</p>
</footer>

</body>
</html>
